name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-lua:
    name: Lint Lua
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, '.lua') || contains(github.event.head_commit.added, '.lua') || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks

      - name: Install luacheck
        run: sudo luarocks install luacheck

      - name: Verify installation
        run: |
          lua -v
          luacheck --version

      - name: Run luacheck
        run: luacheck --config .luacheckrc lua/

      - name: Lint summary
        if: always()
        run: echo "Lua linting completed"

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, '.sh') || contains(github.event.head_commit.added, '.sh') || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          echo "Running shellcheck on all shell scripts..."
          find . -type f -name "*.sh" ! -path "*/node_modules/*" ! -path "*/.git/*" -print0 | \
            xargs -0 shellcheck --severity=warning

      - name: Lint summary
        if: always()
        run: echo "Shell script linting completed"

  validate-schemas:
    name: Validate Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate GitHub Workflows
        run: |
          echo "Validating GitHub workflow files..."
          check-jsonschema --builtin-schema github-workflows .github/workflows/*.yml

      - name: Validate ESLint config
        run: |
          echo "Validating ESLint configuration..."
          check-jsonschema --schemafile https://json.schemastore.org/eslintrc.json .eslintrc.json

      - name: Validate Prettier config
        run: |
          echo "Validating Prettier configuration..."
          check-jsonschema --schemafile https://json.schemastore.org/prettierrc.json .prettierrc.json

      - name: Validate Markdownlint config
        run: |
          echo "Validating Markdownlint configuration..."
          check-jsonschema --schemafile https://json.schemastore.org/markdownlint.json .markdownlint.json

      - name: Validation summary
        if: always()
        run: echo "Schema validation completed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint-lua, lint-shell, validate-schemas]
    if: always() && (needs.lint-lua.result == 'success' || needs.lint-lua.result == 'skipped') && (needs.lint-shell.result == 'success' || needs.lint-shell.result == 'skipped') && needs.validate-schemas.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit luarocks

      - name: Install busted
        run: sudo luarocks install busted

      - name: Verify installation
        run: |
          lua -v
          luajit -v
          busted --version

      - name: Run tests
        run: busted --verbose

      - name: Test summary
        if: always()
        run: echo "Tests completed"
