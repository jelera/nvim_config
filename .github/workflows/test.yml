name: Tests

on:
  workflow_run:
    workflows:
      - 'Lint and Format Lua'
      - 'Lint Shell Scripts'
      - 'Validate Schemas'
    types:
      - completed
    branches: [main]

jobs:
  check-prerequisites:
    name: Check All Workflows Passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      all_passed: ${{ steps.check_workflows.outputs.all_passed }}

    steps:
      - name: Check all required workflows
        id: check_workflows
        uses: actions/github-script@v7
        with:
          script: |
            const requiredWorkflows = [
              'Lint and Format Lua',
              'Lint Shell Scripts',
              'Validate Schemas'
            ];

            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: context.eventName === 'workflow_run' ?
                     context.payload.workflow_run.event : 'push',
              branch: 'main',
              per_page: 100
            });

            // Get the latest run for each required workflow
            const latestRuns = {};
            for (const run of workflowRuns.workflow_runs) {
              if (requiredWorkflows.includes(run.name)) {
                if (!latestRuns[run.name] ||
                    new Date(run.created_at) > new Date(latestRuns[run.name].created_at)) {
                  latestRuns[run.name] = run;
                }
              }
            }

            // Check if all required workflows have succeeded
            const allPassed = requiredWorkflows.every(name =>
              latestRuns[name] &&
              latestRuns[name].conclusion === 'success'
            );

            console.log('Required workflows status:');
            for (const name of requiredWorkflows) {
              const run = latestRuns[name];
              console.log(`  ${name}: ${run ? run.conclusion : 'not found'}`);
            }
            console.log(`All passed: ${allPassed}`);

            core.setOutput('all_passed', allPassed ? 'true' : 'false');

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: ${{ needs.check-prerequisites.outputs.all_passed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit luarocks

      - name: Install busted
        run: |
          sudo luarocks install busted

      - name: Verify installation
        run: |
          lua -v
          luajit -v
          busted --version

      - name: Run tests
        run: busted --verbose

      - name: Test summary
        if: always()
        run: echo "Tests completed"
